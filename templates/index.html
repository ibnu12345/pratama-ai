<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PratamaAI - Asisten Pembelajaran Islam</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f5f0; height: 100vh; display: flex; flex-direction: column; }

        .header { background: linear-gradient(135deg, #1a5c38, #2d8653); color: white; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .logo { width: 42px; height: 42px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .header-text h1 { font-size: 18px; font-weight: 700; }
        .header-text p { font-size: 11px; opacity: 0.85; }
        .header-right { display: flex; gap: 8px; }
        .btn-header { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); color: white; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 12px; }
        .btn-header:hover { background: rgba(255,255,255,0.3); }

        .chat-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }

        .bubble-wrap { display: flex; flex-direction: column; }
        .bubble-wrap.user { align-items: flex-end; }
        .bubble-wrap.ai { align-items: flex-start; }

        .bubble { max-width: 78%; padding: 14px 18px; border-radius: 18px; font-size: 14px; line-height: 1.8; }
        .bubble.user { background: #2d8653; color: white; border-bottom-right-radius: 4px; }
        .bubble.ai { background: white; color: #2c2c2c; border-bottom-left-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

        .nama-ai { font-size: 11px; font-weight: 700; color: #1a5c38; margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }

        .bubble.ai p { margin-bottom: 10px; }
        .bubble.ai p:last-child { margin-bottom: 0; }
        .bubble.ai .arab { font-family: 'Traditional Arabic', 'Arial Unicode MS', serif; font-size: 18px; direction: rtl; text-align: right; display: block; margin: 8px 0; color: #1a5c38; line-height: 2; }
        .bubble.ai .dalil { background: #f0f7f0; border-left: 3px solid #2d8653; padding: 8px 12px; border-radius: 4px; margin: 8px 0; font-style: italic; font-size: 13px; }

        .rating-area { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
        .rating-area span { font-size: 11px; color: #888; }
        .star { font-size: 18px; cursor: pointer; color: #ccc; transition: color 0.2s; }
        .star:hover, .star.active { color: #f5a623; }
        .rating-done { font-size: 11px; color: #2d8653; margin-top: 6px; }

        .loading { display: none; align-items: flex-start; gap: 10px; }
        .loading-bubble { background: white; padding: 14px 18px; border-radius: 18px; border-bottom-left-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .dots span { display: inline-block; width: 7px; height: 7px; background: #2d8653; border-radius: 50%; animation: bounce 1.2s infinite; margin: 0 2px; }
        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-8px)} }

        .input-area { background: white; padding: 14px 20px; display: flex; gap: 10px; border-top: 1px solid #e0e0e0; align-items: center; }
        .input-area input { flex: 1; padding: 11px 18px; border: 1.5px solid #ddd; border-radius: 24px; font-size: 14px; outline: none; transition: border 0.2s; }
        .input-area input:focus { border-color: #2d8653; }
        .btn-kirim { background: #2d8653; color: white; border: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
        .btn-kirim:hover { background: #1a5c38; }

        .sambutan { text-align: center; padding: 30px 20px; color: #666; }
        .sambutan h2 { color: #1a5c38; font-size: 20px; margin-bottom: 8px; }
        .sambutan p { font-size: 13px; margin-bottom: 16px; }
        .contoh-btn { display: inline-block; background: #f0f7f0; border: 1px solid #2d8653; color: #1a5c38; padding: 6px 14px; border-radius: 16px; font-size: 12px; cursor: pointer; margin: 4px; }
        .contoh-btn:hover { background: #2d8653; color: white; }

        .footer { text-align: center; padding: 6px; font-size: 11px; color: #aaa; background: white; border-top: 1px solid #eee; }
        .footer a { color: #2d8653; text-decoration: none; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="logo">🕌</div>
            <div class="header-text">
                <h1>PratamaAI</h1>
                <p>Asisten Pembelajaran PAI</p>
            </div>
        </div>
        <div class="header-right">
            <button class="btn-header" onclick="exportPDF()">⬇ Export PDF</button>
            <button class="btn-header" onclick="resetChat()">↺ Reset</button>
        </div>
    </div>

    <div class="chat-area" id="chatArea">
        <div class="sambutan">
            <h2>Assalamu'alaikum Warahmatullahi Wabarakatuh</h2>
            <p>Selamat datang di PratamaAI. Silakan ajukan pertanyaan seputar Islam.</p>
            <div>
                <span class="contoh-btn" onclick="tanyaContoh('Apa itu rukun Islam?')">Apa itu rukun Islam?</span>
                <span class="contoh-btn" onclick="tanyaContoh('Bagaimana cara sholat yang benar?')">Cara sholat yang benar</span>
                <span class="contoh-btn" onclick="tanyaContoh('Apa keutamaan membaca Al-Quran?')">Keutamaan membaca Al-Quran</span>
            </div>
        </div>
    </div>

    <div class="loading" id="loading">
        <div style="width:32px;height:32px;background:#e8f5e9;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;">🕌</div>
        <div class="loading-bubble">
            <div class="dots"><span></span><span></span><span></span></div>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="inputPertanyaan" placeholder="Tanyakan seputar Islam..." />
        <button class="btn-kirim" id="btnKirim">➤</button>
    </div>

    <div class="footer">
        PratamaAI &copy; 2024 &middot; Penelitian Tesis S2 PAI &middot; <a href="/admin">Admin</a>
    </div>

    <script>
        document.getElementById("btnKirim").addEventListener("click", kirim);
        document.getElementById("inputPertanyaan").addEventListener("keypress", e => { if(e.key==="Enter") kirim(); });

        function tanyaContoh(teks) {
            document.getElementById("inputPertanyaan").value = teks;
            kirim();
        }

        async function kirim() {
            const input = document.getElementById("inputPertanyaan");
            const pertanyaan = input.value.trim();
            if (!pertanyaan) return;
            tambahBubbleUser(pertanyaan);
            input.value = "";
            document.getElementById("loading").style.display = "flex";
            scrollBawah();
            try {
                const res = await fetch("/tanya", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({pertanyaan})
                });
                const data = await res.json();
                document.getElementById("loading").style.display = "none";
                if (data.error) {
                    tambahBubbleAI("Maaf, terjadi kesalahan: " + data.error, null);
                } else {
                    tambahBubbleAI(data.jawaban, data.id);
                }
            } catch(e) {
                document.getElementById("loading").style.display = "none";
                tambahBubbleAI("Maaf, tidak dapat terhubung ke server.", null);
            }
        }

        function tambahBubbleUser(teks) {
            const area = document.getElementById("chatArea");
            const wrap = document.createElement("div");
            wrap.className = "bubble-wrap user";
            const bub = document.createElement("div");
            bub.className = "bubble user";
            bub.textContent = teks;
            wrap.appendChild(bub);
            area.appendChild(wrap);
            scrollBawah();
        }

        function tambahBubbleAI(teks, id) {
            const area = document.getElementById("chatArea");
            const wrap = document.createElement("div");
            wrap.className = "bubble-wrap ai";

            const nama = document.createElement("div");
            nama.className = "nama-ai";
            nama.innerHTML = "🕌 PratamaAI";
            wrap.appendChild(nama);

            const bub = document.createElement("div");
            bub.className = "bubble ai";
            bub.innerHTML = formatJawaban(teks);
            wrap.appendChild(bub);

            if (id) {
                const ratingArea = document.createElement("div");
                ratingArea.className = "rating-area";
                ratingArea.innerHTML = `<span>Nilai jawaban:</span>`;
                for (let i = 1; i <= 5; i++) {
                    const star = document.createElement("span");
                    star.className = "star";
                    star.innerHTML = "★";
                    star.dataset.val = i;
                    star.addEventListener("click", function() {
                        kirimRating(id, i, ratingArea);
                    });
                    star.addEventListener("mouseover", function() {
                        ratingArea.querySelectorAll(".star").forEach((s,idx) => {
                            s.style.color = idx < i ? "#f5a623" : "#ccc";
                        });
                    });
                    star.addEventListener("mouseout", function() {
                        ratingArea.querySelectorAll(".star").forEach(s => {
                            if (!s.classList.contains("active")) s.style.color = "#ccc";
                        });
                    });
                    ratingArea.appendChild(star);
                }
                wrap.appendChild(ratingArea);
            }

            area.appendChild(wrap);
            scrollBawah();
        }

        function formatJawaban(teks) {
            // Pisah per paragraf
            let paragraf = teks.split(/\n\n+/);
            let html = "";
            paragraf.forEach(p => {
                p = p.trim();
                if (!p) return;
                // Deteksi teks Arab
                if (/[\u0600-\u06FF]/.test(p)) {
                    html += `<span class="arab">${p}</span>`;
                } else if (p.startsWith("QS.") || p.startsWith("HR.") || p.startsWith("(QS") || p.startsWith("(HR")) {
                    html += `<div class="dalil">${p}</div>`;
                } else {
                    // Handle newline tunggal dalam paragraf
                    let baris = p.replace(/\n/g, "<br>");
                    html += `<p>${baris}</p>`;
                }
            });
            return html;
        }

        async function kirimRating(id, nilai, ratingArea) {
            await fetch("/rating", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({id, rating: nilai})
            });
            ratingArea.innerHTML = `<span class="rating-done">✓ Terima kasih atas penilaian Anda! (${nilai}/5 ★)</span>`;
        }

        async function resetChat() {
            await fetch("/reset", {method: "POST"});
            const area = document.getElementById("chatArea");
            area.innerHTML = `<div class="sambutan">
                <h2>Assalamu'alaikum Warahmatullahi Wabarakatuh</h2>
                <p>Percakapan direset. Silakan ajukan pertanyaan baru.</p>
            </div>`;
        }

        function exportPDF() {
            window.location.href = "/export-pdf";
        }

        function scrollBawah() {
            const area = document.getElementById("chatArea");
            area.scrollTop = area.scrollHeight;
        }
    </script>
</body>
</html>
